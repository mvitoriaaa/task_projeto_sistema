<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Sistema</title>
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body class="login-body">

  <!-- Toast container (reutiliza os estilos do app) -->
  <div id="toast-container"></div>

  <div class="login-card">

    <!-- Logo -->
    <div class="logo-wrap">
      <img src="logo_fabrica.jpg" width="130" height="130" alt="Logo" style="border-radius:20px;object-fit:cover;" />
    </div>

    <h1>Sistema Industrial</h1>
    <p class="login-sub">Faça login para continuar</p>

    <!-- Tela de login -->
    <div id="tela-login">
      <form id="form-login">
        <div class="input-group">
          <input type="text" id="login-user" placeholder="Usuário" autocomplete="username" maxlength="50" />
        </div>
        <div class="input-group">
          <input type="password" id="login-pass" placeholder="Senha" autocomplete="current-password" maxlength="50" />
          <button type="button" class="btn-olho" id="btn-olho" title="Mostrar/ocultar senha">
            <!-- olho aberto -->
            <svg id="icone-olho-aberto" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <!-- olho fechado -->
            <svg id="icone-olho-fechado" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <button type="submit" class="btn-login">Entrar</button>
      </form>

      <p id="login-bloqueado" class="login-bloqueado oculto">
        Acesso bloqueado. Limite de tentativas atingido.
      </p>
      <p class="login-sub" style="margin-top:1.2rem;">
        <a href="#" id="link-esqueci" class="link-esqueci">Esqueci minha senha</a>
      </p>
    </div>

    <!-- Tela de recuperação -->
    <div id="tela-recuperacao" class="oculto">
      <p class="login-sub" style="margin-bottom:1.2rem;">Informe seu e-mail para receber as instruções de recuperação.</p>
      <form id="form-recuperacao">
        <div class="input-group">
          <input type="email" id="rec-email" placeholder="Seu e-mail" autocomplete="email" />
        </div>
        <button type="submit" class="btn-login">Enviar instruções</button>
      </form>
      <p id="rec-sucesso" class="rec-sucesso oculto">✅ Se este e-mail estiver cadastrado, você receberá as instruções em breve.</p>
      <p style="margin-top:1rem;">
        <a href="#" id="link-voltar" class="link-esqueci">← Voltar ao login</a>
      </p>
    </div>
  </div>

  <script>
    // Redireciona se já estiver logado
    if (sessionStorage.getItem('logado')) window.location.href = 'index.html';

    // ── Constantes ────────────────────────────────────────────────
    const MAX_TENTATIVAS = 5;
    let tentativas = parseInt(sessionStorage.getItem('tentativas_login') || '0');

    // ── Toast (ícones SVG, sem emoji) ─────────────────────────────
    const SVG_ALERTA = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`;
    const SVG_OK     = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`;

    function mostrarToast(mensagem, tipo = 'erro') {
      const icone = tipo === 'ok' ? SVG_OK : SVG_ALERTA;
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${tipo}`;
      toast.innerHTML = `<span class="toast-icone">${icone}</span>${mensagem}`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('saindo');
        toast.addEventListener('animationend', () => toast.remove(), { once: true });
      }, 3500);
    }

    // ── Ver/ocultar senha ─────────────────────────────────────────
    document.getElementById('btn-olho').addEventListener('click', () => {
      const input  = document.getElementById('login-pass');
      const aberto = document.getElementById('icone-olho-aberto');
      const fechado = document.getElementById('icone-olho-fechado');
      if (input.type === 'password') {
        input.type = 'text';
        aberto.style.display  = 'none';
        fechado.style.display = '';
      } else {
        input.type = 'password';
        aberto.style.display  = '';
        fechado.style.display = 'none';
      }
      input.focus();
    });

    // ── Referências ───────────────────────────────────────────────
    const inputUser = document.getElementById('login-user');
    const inputPass = document.getElementById('login-pass');
    const btnLogin  = document.getElementById('form-login').querySelector('button[type="submit"]');

    // ── Botão desabilitado até 2 caracteres em cada campo ─────────
    btnLogin.disabled = true;

    function verificarCampos() {
      btnLogin.disabled = !(inputUser.value.trim().length >= 2 && inputPass.value.length >= 2);
    }

    inputUser.addEventListener('input', () => { inputUser.classList.remove('erro'); verificarCampos(); });
    inputPass.addEventListener('input', () => { inputPass.classList.remove('erro'); verificarCampos(); });

    // ── Validação anti-injeção ────────────────────────────────────
    const PADROES_INJECAO = [
      /<[^>]*>/,          // tags HTML
      /javascript:/i,     // protocolo JS
      /on\w+\s*=/i,       // event handlers (onclick=, onload=...)
      /--/,               // comentário SQL
      /\/\*/,             // bloco SQL
    ];

    function temInjecao(valor) {
      return PADROES_INJECAO.some(p => p.test(valor));
    }

    // ── Bloqueio de acesso ────────────────────────────────────────
    function aplicarBloqueio() {
      inputUser.disabled = true;
      inputPass.disabled = true;
      btnLogin.disabled  = true;
      document.getElementById('btn-olho').disabled = true;
      document.getElementById('login-bloqueado').classList.remove('oculto');
      const linkEsqueci = document.getElementById('link-esqueci');
      linkEsqueci.style.pointerEvents = 'none';
      linkEsqueci.style.opacity = '.35';
    }

    // Aplica bloqueio imediatamente se já tiver atingido o limite
    if (tentativas >= MAX_TENTATIVAS) aplicarBloqueio();

    // ── Login ─────────────────────────────────────────────────────
    document.getElementById('form-login').addEventListener('submit', e => {
      e.preventDefault();

      if (tentativas >= MAX_TENTATIVAS) return;

      const user = inputUser.value.trim();
      const pass = inputPass.value;

      // Bloqueia entrada com padrões de injeção
      if (temInjecao(user) || temInjecao(pass)) {
        inputUser.classList.add('erro');
        inputPass.classList.add('erro');
        mostrarToast('Entrada inválida detectada.');
        return;
      }

      if (user === 'admin' && pass === 'admin') {
        sessionStorage.removeItem('tentativas_login');
        sessionStorage.setItem('logado', 'true');
        window.location.href = 'index.html';
      } else {
        tentativas++;
        sessionStorage.setItem('tentativas_login', tentativas);
        inputUser.classList.add('erro');
        inputPass.classList.add('erro');

        const restantes = MAX_TENTATIVAS - tentativas;
        if (restantes <= 0) {
          aplicarBloqueio();
          mostrarToast('Acesso bloqueado após 5 tentativas.');
        } else {
          mostrarToast(`Credenciais inválidas. ${restantes} tentativa(s) restante(s).`);
        }
      }
    });

    // ── Esqueci a senha ───────────────────────────────────────────
    document.getElementById('link-esqueci').addEventListener('click', e => {
      e.preventDefault();
      document.getElementById('tela-login').classList.add('oculto');
      const rec = document.getElementById('tela-recuperacao');
      rec.classList.remove('oculto');
      rec.style.animation = 'fadeIn .3s ease';
      document.getElementById('rec-email').focus();
    });

    document.getElementById('link-voltar').addEventListener('click', e => {
      e.preventDefault();
      document.getElementById('tela-recuperacao').classList.add('oculto');
      document.getElementById('rec-sucesso').classList.add('oculto');
      document.getElementById('rec-email').value = '';
      const login = document.getElementById('tela-login');
      login.classList.remove('oculto');
      login.style.animation = 'fadeIn .3s ease';
    });

    document.getElementById('form-recuperacao').addEventListener('submit', e => {
      e.preventDefault();
      const email = document.getElementById('rec-email').value.trim();
      if (!email) {
        document.getElementById('rec-email').classList.add('erro');
        return;
      }
      document.getElementById('rec-email').classList.remove('erro');
      document.getElementById('form-recuperacao').classList.add('oculto');
      document.getElementById('rec-sucesso').classList.remove('oculto');
    });
  </script>
</body>
</html>
