<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Sistema</title>
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body class="login-body">

  <!-- Toast container (reutiliza os estilos do app) -->
  <div id="toast-container"></div>

  <div class="login-card">

    <!-- Logo -->
    <div class="logo-wrap">
      <img src="logo_fabrica.jpg" width="130" height="130" alt="Logo" style="border-radius:20px;object-fit:cover;" />
    </div>

    <h1>Sistema Industrial</h1>
    <p class="login-sub">Faça login para continuar</p>

    <!-- Tela de login -->
    <div id="tela-login">
      <form id="form-login">
        <div class="input-group">
          <input type="text" id="login-user" placeholder="Usuário" autocomplete="username" />
        </div>
        <div class="input-group">
          <input type="password" id="login-pass" placeholder="Senha" autocomplete="current-password" />
          <button type="button" class="btn-olho" id="btn-olho" title="Mostrar/ocultar senha">
            <!-- olho aberto -->
            <svg id="icone-olho-aberto" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <!-- olho fechado -->
            <svg id="icone-olho-fechado" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <button type="submit" class="btn-login">Entrar</button>
      </form>

      <p class="login-sub" style="margin-top:1.2rem;">
        <a href="#" id="link-esqueci" class="link-esqueci">Esqueci minha senha</a>
      </p>
    </div>

    <!-- Tela de recuperação -->
    <div id="tela-recuperacao" class="oculto">
      <p class="login-sub" style="margin-bottom:1.2rem;">Informe seu e-mail para receber as instruções de recuperação.</p>
      <form id="form-recuperacao">
        <div class="input-group">
          <input type="email" id="rec-email" placeholder="Seu e-mail" autocomplete="email" />
        </div>
        <button type="submit" class="btn-login">Enviar instruções</button>
      </form>
      <p id="rec-sucesso" class="rec-sucesso oculto">✅ Se este e-mail estiver cadastrado, você receberá as instruções em breve.</p>
      <p style="margin-top:1rem;">
        <a href="#" id="link-voltar" class="link-esqueci">← Voltar ao login</a>
      </p>
    </div>
  </div>

  <script>
    // Redireciona se já estiver logado
    if (sessionStorage.getItem('logado')) window.location.href = 'index.html';

    // ── Toast ─────────────────────────────────────────────────────
    function mostrarToast(mensagem, tipo = 'erro') {
      const icones = { erro: '⚠️', aviso: '⚠️', ok: '✅' };
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${tipo}`;
      toast.innerHTML = `<span class="toast-icone">${icones[tipo] ?? '⚠️'}</span>${mensagem}`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('saindo');
        toast.addEventListener('animationend', () => toast.remove(), { once: true });
      }, 3500);
    }

    // ── Ver/ocultar senha ─────────────────────────────────────────
    document.getElementById('btn-olho').addEventListener('click', () => {
      const input  = document.getElementById('login-pass');
      const aberto = document.getElementById('icone-olho-aberto');
      const fechado = document.getElementById('icone-olho-fechado');
      if (input.type === 'password') {
        input.type = 'text';
        aberto.style.display  = 'none';
        fechado.style.display = '';
      } else {
        input.type = 'password';
        aberto.style.display  = '';
        fechado.style.display = 'none';
      }
      input.focus();
    });

    // ── Login ─────────────────────────────────────────────────────
    const inputUser = document.getElementById('login-user');
    const inputPass = document.getElementById('login-pass');

    // Limpa borda vermelha ao digitar
    inputUser.addEventListener('input', () => inputUser.classList.remove('erro'));
    inputPass.addEventListener('input', () => inputPass.classList.remove('erro'));

    document.getElementById('form-login').addEventListener('submit', e => {
      e.preventDefault();
      const user = inputUser.value.trim();
      const pass = inputPass.value;

      if (user === 'admin' && pass === 'admin') {
        sessionStorage.setItem('logado', 'true');
        window.location.href = 'index.html';
      } else {
        inputUser.classList.add('erro');
        inputPass.classList.add('erro');
        mostrarToast('Credenciais inválidas.');
      }
    });

    // ── Esqueci a senha ───────────────────────────────────────────
    document.getElementById('link-esqueci').addEventListener('click', e => {
      e.preventDefault();
      document.getElementById('tela-login').classList.add('oculto');
      const rec = document.getElementById('tela-recuperacao');
      rec.classList.remove('oculto');
      rec.style.animation = 'fadeIn .3s ease';
      document.getElementById('rec-email').focus();
    });

    document.getElementById('link-voltar').addEventListener('click', e => {
      e.preventDefault();
      document.getElementById('tela-recuperacao').classList.add('oculto');
      document.getElementById('rec-sucesso').classList.add('oculto');
      document.getElementById('rec-email').value = '';
      const login = document.getElementById('tela-login');
      login.classList.remove('oculto');
      login.style.animation = 'fadeIn .3s ease';
    });

    document.getElementById('form-recuperacao').addEventListener('submit', e => {
      e.preventDefault();
      const email = document.getElementById('rec-email').value.trim();
      if (!email) {
        document.getElementById('rec-email').style.borderColor = '#e74c3c';
        return;
      }
      document.getElementById('rec-email').style.borderColor = '';
      document.getElementById('form-recuperacao').classList.add('oculto');
      document.getElementById('rec-sucesso').classList.remove('oculto');
    });
  </script>
</body>
</html>
